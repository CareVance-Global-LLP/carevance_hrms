server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://backend:10000;

        # Nginx defaults to 1m, below every limit the API enforces: proof files
        # are validated at 10M and documents at 15M, and a phone photo of a PAN
        # card clears 1m easily.
        #
        # Note this is NOT the production upload path. deploy/lightsail/Caddyfile
        # sends /api/* straight to backend:10000 and never through this server,
        # so a 413 on the deployed stack comes from FrankenPHP enforcing
        # post_max_size, not from here — raising this value alone would have
        # fixed nothing there. It matters for any topology that does route the
        # API through this container, which is why it is set rather than left
        # at a default that is wrong everywhere.
        client_max_body_size 24m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/(dashboard|projects|tasks|chat|attendance|edit-time|team|monitoring|approval-inbox|reports|invoices|payroll|user-management|employees|audit-logs|add-user|users/add-user|notifications|settings|legacy|desktop-web-dashboard|desktop-web-payroll|login|forgot-password|reset-password|verify-email|accept-invite|signup)(/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
