server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://backend:10000;

        # Nginx defaults to 1m, below every limit the API enforces: proof files
        # are validated at 10M and documents at 15M, and a phone photo of a PAN
        # card clears 1m easily.
        #
        # Note this is NOT the production upload path. deploy/lightsail/Caddyfile
        # sends /api/* straight to backend:10000 and never through this server,
        # so a 413 on the deployed stack comes from FrankenPHP enforcing
        # post_max_size, not from here — raising this value alone would have
        # fixed nothing there. It matters for any topology that does route the
        # API through this container, which is why it is set rather than left
        # at a default that is wrong everywhere.
        client_max_body_size 24m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Real-time notifications (Laravel Reverb).
    #
    # /app/ is the Pusher protocol's client endpoint, not a path we chose, which
    # is why it sits at the root rather than under /api.
    #
    # THE THREE UPGRADE LINES ARE THE WHOLE THING. Unlike Caddy, nginx does not
    # proxy WebSockets transparently: without `proxy_http_version 1.1` and the
    # Upgrade/Connection headers the handshake is answered as an ordinary HTTP
    # request, the client sees a failed upgrade, and the only symptom is that
    # notifications quietly fall back to the 30-second poll. Nothing errors.
    #
    # The trailing slash matters for a second reason: `/app/` does NOT match
    # `/apps/`, which is Reverb's HMAC-authenticated publish API. The backend
    # reaches that directly over the Docker network, and it has no business
    # being routable from the internet.
    #
    # The hour-long timeouts are not generous, they are required. A notification
    # socket is idle by nature — that is the point of it — and nginx's 60-second
    # default would cut healthy connections repeatedly, producing a reconnect
    # loop that looks like a client bug.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/(dashboard|projects|tasks|chat|attendance|edit-time|team|monitoring|approval-inbox|reports|invoices|payroll|user-management|employees|audit-logs|add-user|users/add-user|notifications|settings|legacy|desktop-web-dashboard|desktop-web-payroll|login|forgot-password|reset-password|verify-email|accept-invite|signup)(/|$) {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
