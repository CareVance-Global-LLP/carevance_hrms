<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BRAND_FAVICON%" sizes="any" />
    <link rel="shortcut icon" href="%BRAND_FAVICON%" />
    <link rel="icon" type="image/png" href="%BRAND_LOGO_MARK%" />
    <link rel="apple-touch-icon" href="%BRAND_LOGO_MARK%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fonts, discovered in the initial HTML parse.

      These were an `@import` at the top of src/index.css, which measured 903ms
      of render-blocking time: an @import is invisible to the browser until the
      importing stylesheet has been fetched and parsed, so bundle → font CSS →
      font files ran strictly in series.

      Both preconnects are needed and they are not interchangeable:
      `fonts.googleapis.com` serves the CSS, `fonts.gstatic.com` serves the font
      files, and the gstatic one MUST carry `crossorigin` because fonts are
      fetched in CORS mode — without it the browser opens a second, unusable
      connection and the hint is wasted.

      `display=swap` is already in the URL, so text paints immediately in the
      fallback face and swaps when the webfont lands.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded ASYNCHRONOUSLY. A plain `rel="stylesheet"` is render-blocking by
      definition — moving the import here made it discoverable early but it
      still held first paint for 916ms, measured.

      `rel="preload" as="style"` fetches at high priority without blocking, then
      the onload handler promotes it to a real stylesheet. This is only safe
      because the URL already carries `display=swap`: text paints immediately in
      the fallback face and swaps when Manrope arrives. Without swap this trade
      would be invisible text instead of blocked rendering, which is worse.

      The <noscript> copy keeps the fonts for readers without JavaScript, who
      would otherwise never get the promotion.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
    <meta
      name="description"
      content="%BRAND_DESCRIPTION%"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="application-name" content="%BRAND_PRODUCT_NAME%" />
    <meta property="og:site_name" content="%BRAND_PRODUCT_NAME%" />
    <meta property="og:title" content="%BRAND_PRODUCT_NAME%" />
    <meta
      property="og:description"
      content="%BRAND_DESCRIPTION%"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BRAND_LOGO_FULL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_PRODUCT_NAME%" />
    <meta
      name="twitter:description"
      content="%BRAND_DESCRIPTION%"
    />
    <meta name="twitter:image" content="%BRAND_LOGO_FULL%" />
    <!--
      `defer`, because this blocked rendering for 308ms as a plain script.

      Deferred classic scripts still execute in document order and still run
      before the module below (module scripts are deferred by definition), so
      `window` config is populated before the app boots — the ordering this file
      actually depends on is preserved. What changes is that it no longer halts
      the parser while it downloads.
    -->
    <script defer src="/env-config.js"></script>
    <script>
      /*
       * Resolve the theme before first paint. React mounts several providers
       * deep, so waiting for it would show a white flash before dark applies.
       * Kept inline and dependency-free for that reason — see ThemeContext.tsx
       * for the rest of the runtime, which reads the same storage key.
       */
      (function () {
        try {
          var stored = localStorage.getItem('carevance.theme');
          var choice = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = choice === 'system' ? (prefersDark ? 'dark' : 'light') : choice;
          document.documentElement.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0E141A' : '#f8fafc');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>%BRAND_PRODUCT_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
