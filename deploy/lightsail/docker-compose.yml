services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - carevance

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 10000
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:10000"
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - carevance

  queue:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    # --tries=1 drops a job permanently on the first transient failure and
    # --timeout=0 lets one hung job stall the only worker. Retry instead.
    command: ["sh", "-lc", "php artisan queue:work --tries=3 --timeout=60 --sleep=3"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - carevance

  # Runs Laravel's scheduler. Without it every command in routes/console.php
  # never fires — stale and idle timers stay open, departed employees keep
  # access, onboarding journeys never advance, reminders never send.
  scheduler:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: ["sh", "-lc", "php artisan schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - carevance

  # The WebSocket server behind real-time notifications. Caddy proxies /app/*
  # here, which is the client-facing endpoint the Pusher protocol connects to;
  # the backend publishes to it over this network and never through the edge.
  #
  # Without it notifications do not stop — the clients detect a socket they
  # cannot open and fall back to a 30-second poll, which is how the product
  # behaved before this service existed. The visible symptom is the
  # notification panel reporting "Every 30s" instead of "Live", which is
  # deliberate: a transport that fails invisibly is the failure mode that
  # matters, and the reason the timers-run-all-night bug went unnoticed for a
  # day.
  #
  # No storage volume: it holds connections, not files, and writes nothing.
  reverb:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: ["sh", "-lc", "php artisan reverb:start --host=0.0.0.0 --port=8080"]
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - carevance

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WEB_APP_URL: ${VITE_WEB_APP_URL}
      VITE_DESKTOP_DOWNLOAD_URL: ${VITE_DESKTOP_DOWNLOAD_URL}
      VITE_DESKTOP_DOWNLOAD_LABEL: ${VITE_DESKTOP_DOWNLOAD_LABEL}
      VITE_IDLE_TRACK_THRESHOLD_SECONDS: ${VITE_IDLE_TRACK_THRESHOLD_SECONDS}
      VITE_IDLE_AUTO_STOP_THRESHOLD_SECONDS: ${VITE_IDLE_AUTO_STOP_THRESHOLD_SECONDS}
      VITE_IDLE_GUARD_INTERVAL_MS: ${VITE_IDLE_GUARD_INTERVAL_MS}
      # VITE_REVERB_APP_KEY is the on switch for real-time notifications, and
      # must match REVERB_APP_KEY on the backend exactly. Unset means the
      # clients never attempt a socket and stay on their 30-second poll.
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    depends_on:
      backend:
        condition: service_started
      # nginx resolves proxy_pass upstreams at STARTUP, so without this the
      # frontend aborts with "host not found in upstream: reverb" whenever it
      # boots first — taking the web app down over a notification transport.
      reverb:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - carevance

volumes:
  postgres_data:
  backend_storage:

networks:
  carevance:
    driver: bridge
