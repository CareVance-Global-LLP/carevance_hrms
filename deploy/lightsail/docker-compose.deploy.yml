# The single deployed topology. `docker-compose.ci.yml` (which the workflow used)
# and `docker-compose.production.yml` (which deploy.sh used) disagreed about the
# most load-bearing setting in the stack: production.yml pinned
# QUEUE_CONNECTION=sync on the web container while the worker polled the
# database queue, so `process-remaining` returned 202 and then ran inline under a
# 300s limit against a job declaring timeout=3600 — a real payroll run died at
# five minutes, half processed — and SendInvitationMail's tries=3 became one
# attempt, silently losing an invitation on any SMTP hiccup.
#
# There is no QUEUE_CONNECTION anywhere below on purpose. Every container
# inherits it from .env, so the web app and the worker cannot drift apart.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - carevance

  # Cache, session store and queue backend.
  #
  # Every one of those defaulted to `database`, so a read-only API call cost a
  # write to the same Postgres that computes payroll, and month-end contended
  # with ordinary attendance traffic on one connection pool. Redis is a
  # separate, in-memory store for work that is by nature ephemeral.
  #
  # Optional by construction: with REDIS_HOST unset the application falls back
  # to the database drivers it used before, so an existing deployment that has
  # not been reconfigured keeps working exactly as it did.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence. Everything here is a cache, a session or a queued job;
    # none of it is a system of record, and an fsync per write buys nothing.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - carevance

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before running docker compose}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bound to loopback: caddy is the only ingress, and this stack now serves
    # over TLS. The mapping stays so the API can still be curled on the box
    # while debugging, without publishing plaintext to the internet.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:10000"
    # /api/health/simple, not /api/health: liveness should report whether PHP is
    # executing, not flap the container every time Postgres blinks. The deploy's
    # health gate polls the full check instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:10000/api/health/simple"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - carevance

  queue:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before running docker compose}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    # --tries=1 means a single SMTP hiccup permanently drops the mail, and
    # --timeout=0 means one hung job stalls the only worker forever.
    command: ["sh", "-lc", "php artisan queue:work --tries=3 --timeout=60 --sleep=3"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - carevance

  # Runs Laravel's scheduler. Without it every command in routes/console.php —
  # closing stale and idle timers, revoking access for departed employees,
  # advancing onboarding journeys, task reminders and recurrences — never fires.
  scheduler:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before running docker compose}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    command: ["sh", "-lc", "php artisan schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - carevance

  # The WebSocket server behind real-time notifications. Caddy proxies /app/*
  # here — that path is the Pusher protocol's, not ours. The backend publishes
  # to it over this network and never through the edge.
  #
  # Without it notifications do not stop: clients detect a socket they cannot
  # open and fall back to a 30-second poll, which is how the product behaved
  # before this service existed. The visible symptom is the notification panel
  # reading "Every 30s" instead of "Live" — deliberate, because a transport
  # that fails invisibly is the failure mode that actually costs you.
  #
  # No storage volume: it holds connections, not files, and writes nothing.
  reverb:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before running docker compose}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    command: ["sh", "-lc", "php artisan reverb:start --host=0.0.0.0 --port=8080"]
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - carevance

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE before running docker compose}
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WEB_APP_URL: ${VITE_WEB_APP_URL}
      VITE_DESKTOP_DOWNLOAD_URL: ${VITE_DESKTOP_DOWNLOAD_URL}
      VITE_DESKTOP_DOWNLOAD_LABEL: ${VITE_DESKTOP_DOWNLOAD_LABEL}
      VITE_IDLE_TRACK_THRESHOLD_SECONDS: ${VITE_IDLE_TRACK_THRESHOLD_SECONDS}
      VITE_IDLE_AUTO_STOP_THRESHOLD_SECONDS: ${VITE_IDLE_AUTO_STOP_THRESHOLD_SECONDS}
      VITE_IDLE_GUARD_INTERVAL_MS: ${VITE_IDLE_GUARD_INTERVAL_MS}
      # Real-time notifications. VITE_REVERB_APP_KEY is the on switch: leave it
      # unset and the clients never attempt a socket and stay on their 30-second
      # poll, which is the pre-real-time behaviour. It must match REVERB_APP_KEY
      # on the backend exactly — a mismatch fails at subscribe time, silently,
      # and looks identical to the daemon being down.
      #
      # Host and port default to the page's own origin over 443, because Caddy
      # proxies /app/* on the same domain. Only set them if the socket is
      # somewhere the browser genuinely cannot infer.
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    depends_on:
      backend:
        condition: service_started
      # nginx resolves proxy_pass upstreams at STARTUP, so without this the
      # frontend container aborts with "host not found in upstream: reverb"
      # whenever it happens to boot first — taking the whole web app down over
      # a notification transport.
      reverb:
        condition: service_started
    # No published port. It used to take host :80, which caddy now needs for the
    # ACME HTTP-01 challenge; caddy reaches it over the carevance network.
    networks:
      - carevance

  # Terminates TLS and routes the two upstreams. See ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env — caddy needs it to request a certificate}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and the ACME account key. Without this volume every
      # `up -d` re-issues, and Let's Encrypt's rate limit turns a few deploys in
      # a day into a site with no certificate at all.
      - caddy_data:/data
      - caddy_config:/config
      # Desktop update channel, published to by scripts/publish-update.cjs.
      - ${UPDATES_DIR:-/var/www/updates}:/var/www/updates:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - carevance

volumes:
  postgres_data:
  backend_storage:
  caddy_data:
  caddy_config:

networks:
  carevance:
    driver: bridge
