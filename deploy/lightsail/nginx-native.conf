# The nginx blocks that production actually runs
#
# THIS FILE DOCUMENTS A LIVE SERVER, IT IS NOT DEPLOYED FROM.
#
# Production on Lightsail is a NATIVE deploy — nginx + PHP-FPM on the host,
# reading `/var/www/carevance/{frontend/dist,backend}`. It is not the
# docker-compose + Caddy stack the rest of this directory describes; that
# stack is aspirational and nothing runs it. `deploy-lightsail.yml` builds
# images that the live box does not use.
#
# Everything below was added by hand to
# `/etc/nginx/sites-available/carevance` on 25 Aug 2026, inside the HTTPS
# server block (the one carrying `ssl_certificate`). It is recorded here
# because a rebuild of that box loses all of it, and each block's absence
# produces a bug whose cause is very hard to see from the symptom.
#
# ORDER DOES NOT MATTER to nginx — prefix matching takes the longest match,
# so these beat `location /` wherever they sit. They are placed above it for
# readers, not for nginx.

# ---------------------------------------------------------------------------
# 1. Desktop tracker update feed
#
# WHAT ITS ABSENCE LOOKS LIKE: the tracker's "Check Now" throws a YAMLException
# with "<!doctype html>" in the raw data. Every path under /updates/ fell
# through to the SPA catch-all and returned 200 with index.html, so
# electron-updater parsed the React app as YAML.
#
# A 404 here is CORRECT and harmless — the updater reads it as "no update
# available". The 200-of-HTML is what crashes it. That is what `=404` buys.
#
# Artefacts are published by `desktop/scripts/publish-update.cjs`; see
# docs/desktop-updates.md.
location /updates/ {
    root /var/www/carevance;
    autoindex off;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

# ---------------------------------------------------------------------------
# 2. Real-time notifications (Laravel Reverb)
#
# WHAT ITS ABSENCE LOOKS LIKE: nothing. Clients that cannot open a socket fall
# back to the 30-second poll the product used before real-time existed, so
# notifications get slower and never lost. The notification panel reads
# "Every 30s" instead of "Live" — that is the only signal, and it is
# deliberate.
#
# THE THREE UPGRADE LINES ARE THE WHOLE THING. Unlike Caddy, nginx does not
# proxy WebSockets transparently: without `proxy_http_version 1.1` and the
# Upgrade/Connection headers the handshake is answered as an ordinary HTTP
# request and the upgrade silently fails.
#
# PORT 8081, NOT 8080. nginx already binds 127.0.0.1:8080 for the internal
# backend vhost, so Reverb cannot bind there — it sits in a systemd restart
# loop reporting "activating" forever. The repo's docker-compose says 8080
# because in that stack nginx is in a different container.
#
# The trailing slash is load-bearing twice: `/app/` does NOT match `/apps/`,
# which is Reverb's HMAC-authenticated publish API. The backend reaches that
# over loopback; it must never be routable from the internet. Verified: a
# request to /apps/1/events returns the SPA, not Reverb.
#
# The hour-long timeouts are required, not generous. A notification socket is
# idle by nature and nginx's 60-second default cuts healthy connections,
# producing a reconnect loop that looks like a client bug.
location /app/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ---------------------------------------------------------------------------
# 3. Runtime configuration
#
# WHAT ITS ABSENCE LOOKS LIKE: a config change appears to do nothing for
# anyone who does not hard-refresh. This file carries VITE_REVERB_APP_KEY —
# the on switch for sockets — so a cached copy keeps a browser on the poll
# with nothing on screen explaining why.
location = /env-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}
