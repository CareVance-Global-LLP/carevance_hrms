<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0f172a;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #close:hover { background: rgba(255, 255, 255, 0.3); }
    #stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    #stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background: #fff;
    }
    #msg {
      color: #cbd5e1;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <button id="close" aria-label="Close" title="Close">&times;</button>
  <div id="stage"><span id="msg">Loading receipt…</span></div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var url = params.get('url');
      var stage = document.getElementById('stage');
      document.getElementById('close').addEventListener('click', function () {
        window.close();
      });

      if (!url) {
        stage.innerHTML = '<span id="msg">No receipt URL provided.</span>';
        return;
      }

      var ext = (url.split('.').pop() || '').split('?')[0].toLowerCase();
      var isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) !== -1;

      if (isImage) {
        var img = document.createElement('img');
        img.alt = 'Receipt';
        img.onload = function () { stage.innerHTML = ''; stage.appendChild(img); };
        img.onerror = function () {
          stage.innerHTML = '<span id="msg">Unable to load receipt.</span>';
        };
        img.src = url;
      } else {
        var frame = document.createElement('iframe');
        frame.src = url;
        stage.innerHTML = '';
        stage.appendChild(frame);
      }
    })();
  </script>
</body>
</html>
