# Landing page guards.
#
# Two things are checked here that nothing else in CI can catch, and both
# caught real regressions that had already shipped or were about to:
#
#   1. TEXT ENCODING. Windows PowerShell's `Get-Content` reads in the console's
#      ANSI codepage, so any read-modify-write through it mangles every ₹, em
#      dash and curly quote in the file. A landing-page heading reached the
#      browser reading "doesn’t" as "doesnâ€™t". It is invisible in review
#      unless you know to look, and it is trivially repeatable.
#
#   2. THE CLAIMS AND THE PICTURES. The page once shipped eight invented
#      customer logos, a fabricated 4.8-star aggregateRating, "10,000+ users"
#      and two SOC 2 badges — none of which existed. Later it illustrated the
#      product tour with screenshots of an EMPTY tenant: 0h 0m tracked, ₹0
#      payroll, every statutory filing marked "Needs run", each sitting under a
#      caption claiming the opposite.
#
# A unit test cannot see either failure: the first is a byte-level fault and the
# second only exists in the rendered page. So this drives a real browser against
# a production build.
name: Landing page

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/landing.yml'

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cheap and independent of a browser, so it runs first and fails fast.
      - name: Check text encoding
        run: npm run verify:encoding

      - name: Type-check
        run: npx tsc --noEmit

      # Against the PRODUCTION build, never the dev server: Vite dev serves
      # unminified modules over HMR, so anything measured there is meaningless.
      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Server and check in ONE step, deliberately. A background process started
      # in one Actions step is not guaranteed to survive into the next, and the
      # failure mode is a confusing "connection refused" rather than an obvious
      # "the server died". Polled with curl rather than `wait-on`, which is not
      # a dependency here; a fixed sleep is the flaky alternative — too short on
      # a cold runner, wasted time on a warm one.
      - name: Serve the build and verify it
        run: |
          npx vite preview --port 4173 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            if [ "$i" -eq 60 ]; then
              echo "preview did not start within 60s" >&2
              exit 1
            fi
            sleep 1
          done

          npm run verify:landing http://localhost:4173/
