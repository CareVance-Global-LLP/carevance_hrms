name: Deploy Lightsail

# NATIVE DEPLOY. Production is nginx + PHP-FPM + PostgreSQL installed on the
# host, with four systemd units — it is NOT the docker-compose stack in
# deploy/lightsail/. See deploy/lightsail/SYSTEMD-NATIVE.md.
#
# This workflow used to build Docker images, push them to GHCR and run
# `docker compose up` on the server. The server runs none of that. What made it
# appear to work was one line — `git pull origin main` — because PHP-FPM serves
# from disk, so pulled code takes effect whether or not anything else succeeds.
# Everything after that line was operating on containers that do not exist.
#
# That gap cost a day: a Reverb service added to docker-compose.deploy.yml did
# nothing, an /updates/ rule added to the Caddyfile did nothing, and both looked
# committed and deployed. A green tick on a workflow that ships nothing is worse
# than a red one.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate. tests.yml and this workflow both triggered on push to main and
  # neither waited for the other, so a red build shipped. Calling it here means
  # nothing deploys unless both suites clear their baselines.
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Lightsail
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: DEPLOY_SHA
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu

            APP_DIR="/var/www/carevance"
            BACKEND="$APP_DIR/backend"
            FRONTEND="$APP_DIR/frontend"
            BACKUP_DIR="/var/backups/carevance"
            APP_DOMAIN="carevancetracker.duckdns.org"

            # Every long-running process. A deploy that migrates the schema but
            # leaves these on the old code is the hardest kind of bug to see:
            # the web app is correct and the workers are not.
            SERVICES="carevance-backend carevance-queue carevance-reverb carevance-scheduler"

            cd "$APP_DIR"

            # (a) The revision currently serving traffic. Written only after a
            # health check passes, so it never names a revision that was merely
            # attempted — which is what makes it safe to roll back to.
            PREVIOUS_SHA="$(cat .deployed-sha 2>/dev/null || git rev-parse HEAD)"
            echo "currently deployed: $PREVIOUS_SHA"
            echo "deploying:          $DEPLOY_SHA"

            # (b) A restore point taken minutes before the migration rather than
            # from last night. Rollback below covers application code only:
            # reverting a migration automatically is not safe — a down-migration
            # that drops a column destroys everything written since the deploy.
            # If a migration is the problem, this dump is the recovery path and
            # a human decides.
            mkdir -p "$BACKUP_DIR" 2>/dev/null || sudo -n mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/carevance-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"

            # Dumped uncompressed first, deliberately. Piping into gzip would
            # hide pg_dump's exit status behind gzip's from `set -e`, and would
            # leave a file that passes `-s` no matter what: gzip writes a header
            # for empty input, so an empty dump still lands ~20 bytes and looks
            # like a backup until the day somebody needs it.
            sudo -n -u postgres pg_dump carevance > "$BACKUP_FILE.raw"
            if [ ! -s "$BACKUP_FILE.raw" ]; then
              rm -f "$BACKUP_FILE.raw"
              echo "pg_dump produced an empty backup — refusing to migrate"
              exit 1
            fi
            gzip -c "$BACKUP_FILE.raw" > "$BACKUP_FILE"
            rm -f "$BACKUP_FILE.raw"
            echo "backup: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
            find "$BACKUP_DIR" -name 'carevance-*.sql.gz' -mtime +7 -delete

            # (c) The code itself.
            git fetch origin main
            git checkout -f "$DEPLOY_SHA"

            # (d) Backend dependencies. --no-dev because dev packages are not
            # only wasted disk here, they put debug tooling on a public host.
            cd "$BACKEND"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # (e) Migrations, once per deploy and visible here. Run BEFORE the
            # caches are rebuilt so a schema change and the config that depends
            # on it never disagree.
            php artisan migrate --force

            # (f) The renderer. Built on the server because there is no image to
            # bake it into. env-config.js is NOT rebuilt — it carries
            # per-deployment values including VITE_REVERB_APP_KEY, and a build
            # that overwrote it would silently switch real-time notifications
            # off and leave every client on the 30-second poll.
            cd "$FRONTEND"
            cp dist/env-config.js /tmp/env-config.js.keep 2>/dev/null || true
            npm ci --no-audit --no-fund
            npm run build
            if [ -f /tmp/env-config.js.keep ]; then
              cp /tmp/env-config.js.keep dist/env-config.js
              echo "env-config.js preserved across the build"
            fi

            # (g) Caches last, so they are built from the code that just landed.
            cd "$BACKEND"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # (h) Restart every daemon. `reload` is not enough: these are
            # long-lived PHP processes that loaded their code at boot.
            for s in $SERVICES; do sudo -n systemctl restart "$s"; done
            sudo -n systemctl reload php8.4-fpm
            sudo -n systemctl reload nginx

            # (i) 60s budget, asked of the certificate's own name so it verifies
            # the edge end to end rather than a local port. Until this passes,
            # the deploy is not a deploy.
            echo "health gate: https://$APP_DOMAIN/api/health"
            HEALTHY=0
            attempt=1
            while [ "$attempt" -le 20 ]; do
              if curl -fsS --max-time 5 -o /dev/null "https://$APP_DOMAIN/api/health"; then
                HEALTHY=1
                echo "healthy after $(( (attempt - 1) * 3 ))s"
                break
              fi
              sleep 3
              attempt=$((attempt + 1))
            done

            # (j) The post-deploy checks here used to end in `|| true`, so
            # nothing in this script could fail a deploy and a bad one simply
            # stayed up.
            if [ "$HEALTHY" -ne 1 ]; then
              echo "health check failed after 60s — rolling code back to $PREVIOUS_SHA"
              cd "$APP_DIR"
              git checkout -f "$PREVIOUS_SHA"
              cd "$BACKEND"
              composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
              php artisan config:cache && php artisan route:cache && php artisan view:cache
              cd "$FRONTEND"
              cp /tmp/env-config.js.keep dist/env-config.js 2>/dev/null || true
              npm ci --no-audit --no-fund && npm run build
              cp /tmp/env-config.js.keep dist/env-config.js 2>/dev/null || true
              for s in $SERVICES; do sudo -n systemctl restart "$s"; done
              sudo -n systemctl reload php8.4-fpm nginx
              echo "rolled back. THE DATABASE WAS NOT ROLLED BACK — if a migration"
              echo "is the cause, restore from $BACKUP_FILE by hand."
              exit 1
            fi

            # (k) Only now is this revision one we would fall back to.
            cd "$APP_DIR"
            echo "$DEPLOY_SHA" > .deployed-sha

            echo "--- deployed $DEPLOY_SHA ---"
            for s in $SERVICES; do printf '%-24s %s\n' "$s" "$(systemctl is-active "$s")"; done
