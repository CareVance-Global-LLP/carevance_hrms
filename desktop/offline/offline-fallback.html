<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline</title>
<style>
/*
 * This page is loaded by the main process from file://, so none of the web
 * app's theme CSS reaches it. `prefers-color-scheme` does though, and the shell
 * pins nativeTheme.themeSource to the user's in-app choice — so these two
 * blocks are enough to keep the offline screen in the same theme as the
 * workspace it replaced. Values mirror the app's --app-bg / --surface-card /
 * neutral tokens.
 */
:root {
  color-scheme: light;
  --page: #F5F7F8; --card: #ffffff; --ink: #16191C; --muted: #4E565D; --faint: #9AA4AC;
  --line: #D2D8DD; --sunken: #F1F4F6;
  --accent: #5D969D; --accent-hover: #3D656B; --on-accent: #ffffff;
  --warn-bg: #FDECCB; --warn-ink: #7A560E;
  --ok-bg: #D1FAE5; --ok-ink: #065F46;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0E141A; --card: #161F26; --ink: #E6EDF0; --muted: #A9B8C0; --faint: #869298;
    --line: #2A3841; --sunken: #0A1015;
    --accent: #6FA9B0; --accent-hover: #8CC6CE; --on-accent: #0E141A;
    --warn-bg: #45341E; --warn-ink: #F0CE8E;
    --ok-bg: #123C36; --ok-ink: #8FE0BA;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Segoe UI, Arial, sans-serif; background: var(--page); color: var(--ink); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { width: min(520px, 90%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: 0 14px 35px rgba(0,0,0,0.18); text-align: center; }
.icon { font-size: 48px; margin-bottom: 12px; }
h1 { font-size: 22px; margin-bottom: 8px; }
p { color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
.status { background: var(--sunken); border-radius: 10px; padding: 16px; margin-bottom: 20px; text-align: left; }
.status-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.status-label { color: var(--muted); }
.status-value { font-weight: 600; }
.badge { display: inline-block; background: var(--warn-bg); color: var(--warn-ink); border-radius: 20px; padding: 2px 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
.badge.connected { background: var(--ok-bg); color: var(--ok-ink); }
.btn { background: var(--accent); color: var(--on-accent); border: none; border-radius: 10px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.small { font-size: 13px; color: var(--faint); margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#9888;</div>
  <h1>You are offline</h1>
  <p>The tracker could not reach the server. Your data is being saved locally and will sync when the connection is restored.</p>
  <div class="badge" id="statusBadge">Offline Mode</div>
  <div class="status">
    <div class="status-row"><span class="status-label">Connection</span><span class="status-value" id="connectionStatus">Checking...</span></div>
    <div class="status-row"><span class="status-label">Pending records</span><span class="status-value" id="pendingCount">0</span></div>
    <div class="status-row"><span class="status-label">Last sync</span><span class="status-value" id="lastSync">Never</span></div>
    <div class="status-row"><span class="status-label">Sync status</span><span class="status-value" id="syncStatus">Idle</span></div>
  </div>
  <button class="btn" id="retryBtn" onclick="retry()">Retry connection</button>
  <p class="small" id="autoStatus">Auto-reconnecting in 10s...</p>
</div>
<script>
let retryTimer = null;
let statusInterval = null;
let cleanup = null;

function updateStatus(data) {
  document.getElementById('connectionStatus').textContent = data.online ? 'Online' : 'Offline';
  document.getElementById('pendingCount').textContent = data.pendingRecords ?? data.queueSize ?? 0;
  document.getElementById('lastSync').textContent = data.lastSyncAt ? new Date(data.lastSyncAt).toLocaleString() : 'Never';
  document.getElementById('syncStatus').textContent = data.isSyncing ? 'Syncing...' : 'Idle';
  if (data.online) {
    // A class, not inline hex — the literals stayed a pale green chip with dark
    // green text no matter which theme the shell was in.
    document.getElementById('statusBadge').textContent = 'Connected — reloading...';
    document.getElementById('statusBadge').classList.add('connected');
    document.getElementById('autoStatus').textContent = 'Online! Reloading...';
    setTimeout(() => { window.location.reload(); }, 1000);
  }
}

async function refreshStatus() {
  try {
    if (window.desktopTracker && window.desktopTracker.getOfflineStatus) {
      const status = await window.desktopTracker.getOfflineStatus();
      updateStatus(status);
    }
  } catch (e) {
    console.warn('[offline-page] status refresh failed:', e);
  }
}

function retry() {
  document.getElementById('retryBtn').disabled = true;
  document.getElementById('retryBtn').textContent = 'Checking...';
  clearTimeout(retryTimer);
  refreshStatus().finally(() => {
    setTimeout(() => {
      document.getElementById('retryBtn').disabled = false;
      document.getElementById('retryBtn').textContent = 'Retry connection';
    }, 2000);
  });
}

function startAutoReconnect() {
  let countdown = 10;
  const autoEl = document.getElementById('autoStatus');
  function tick() {
    if (countdown <= 0) {
      countdown = 10;
      refreshStatus();
    }
    autoEl.textContent = `Auto-reconnecting in ${countdown}s...`;
    countdown--;
  }
  tick();
  retryTimer = setInterval(tick, 1000);
}

async function init() {
  await refreshStatus();
  startAutoReconnect();

  if (window.desktopTracker && window.desktopTracker.onOfflineStatusChange) {
    cleanup = window.desktopTracker.onOfflineStatusChange((status) => {
      updateStatus(status);
    });
  }

  statusInterval = setInterval(refreshStatus, 15000);
}

init();

window.addEventListener('beforeunload', () => {
  if (cleanup && typeof cleanup === 'function') cleanup();
  if (statusInterval) clearInterval(statusInterval);
  if (retryTimer) clearInterval(retryTimer);
});
</script>
</body>
</html>
