            - heading "Real EPFO and NSDL formats, and a bank file that never drops anyone." [level=3] [ref=f11e393]
            - paragraph [ref=f11e394]: Thirteen statutory outputs generate today in the formats the portals actually accept. The NEFT/RTGS batch records every line, and people who cannot be paid — missing bank details, a stop-payment flag — come back as named exclusions rather than quietly vanishing from a total that then does not reconcile.
