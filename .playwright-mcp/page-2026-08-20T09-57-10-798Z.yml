    - generic [ref=f11e248]:
      - generic [ref=f11e249]:
        - paragraph [ref=f11e250]: Governed overrides
        - heading "The module that made this product worth building." [level=2] [ref=f11e251]
        - paragraph [ref=f11e252]: Every payroll system lets you override a component. The interesting question is what happens next — whether the system tells you what the change actually cost, and what it does when the change cannot work.
      - generic [ref=f11e253]:
        - generic [ref=f11e254]:
          - generic [ref=f11e255]:
            - paragraph [ref=f11e256]: Amplification
            - heading "Raising Basic by ₹1 costs ₹1.668. The screen says so before you commit." [level=3] [ref=f11e257]
            - paragraph [ref=f11e258]: HRA is derived from Basic. Employer PF is computed on it. The gratuity provision is 4.81% of it. All three sit inside the CTC envelope, so four quantities move together — and an admin who types ‘Basic 60,000’ expecting Special Allowance to drop by ₹12,000 watches it drop by ₹20,016. No product in this market shows that, which is exactly why an override screen needs a preview rather than a plain input.
            - list [ref=f11e259]:
              - listitem [ref=f11e260]:
                - generic [ref=f11e263]: The preview names the absorbing component and its before and after
              - listitem [ref=f11e264]:
                - generic [ref=f11e267]: The residual role only ever falls to a taxable component
              - listitem [ref=f11e268]:
                - generic [ref=f11e271]: Two components claiming the residual is a configuration error, not a coin flip
