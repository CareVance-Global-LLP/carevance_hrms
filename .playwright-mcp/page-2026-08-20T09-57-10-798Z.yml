          - generic [ref=f11e292]:
            - paragraph [ref=f11e293]: Refusal
            - heading "When it cannot balance, it says no — and names the maximum." [level=3] [ref=f11e294]
            - paragraph [ref=f11e295]: A negative residual is not a warning to be dismissed; it is an impossible structure. Rather than accept the value and fail at finalisation weeks later, the balancer refuses at entry and tells you the largest value that would work, to the paisa, while you are still looking at the screen and the fix is cheap.
