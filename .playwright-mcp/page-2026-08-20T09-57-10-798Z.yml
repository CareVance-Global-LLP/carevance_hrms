    - generic [ref=f11e151]:
      - generic [ref=f11e152]:
        - paragraph [ref=f11e153]: The run
        - heading "Five states, each one stamped with who and when." [level=2] [ref=f11e154]
        - paragraph [ref=f11e155]: A payroll run moves draft → locked → approved → released → disbursed. Every transition records the actor and the timestamp, and a closed run cannot be written to casually — there is a guard, and it names itself in the stack trace when something tries.
      - generic [ref=f11e156]:
        - generic [ref=f11e157]:
          - generic [ref=f11e158]:
            - paragraph [ref=f11e159]: Processing
            - heading "Queued, pollable, and refused if you start it twice." [level=3] [ref=f11e160]
            - paragraph [ref=f11e161]: Processing a run does not block a request for four minutes. It returns immediately with a progress handle, and the client polls until it finishes. Start a second run while one is in flight and you get a 409 rather than a queue position — two workers walking the same list would race to create the same payroll item.
            - list [ref=f11e162]:
              - listitem [ref=f11e163]:
                - generic [ref=f11e166]: Returns 202 with a progress handle, not a four-minute request
              - listitem [ref=f11e167]:
                - generic [ref=f11e170]: A retry is deliberately not attempted — a partial run must not be re-entered
              - listitem [ref=f11e171]:
                - generic [ref=f11e174]: Failures are recorded on the run for a human, not swallowed
            - generic [ref=f11e175]:
              - paragraph [ref=f11e176]: "409"
              - paragraph [ref=f11e177]: what a concurrent second start returns, rather than racing
