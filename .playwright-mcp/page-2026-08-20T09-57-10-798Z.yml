            - paragraph [ref=f11e209]: Structure
            - heading "CTC in, components out, and the total balances to the paisa." [level=3] [ref=f11e210]
            - paragraph [ref=f11e211]: Salary structures are built from formula, slab and lookup components, with CTC range bands and pay groups on top. One component is designated the residual and absorbs whatever is left, so the sum returns to CTC exactly rather than approximately.
            - list [ref=f11e212]:
              - listitem [ref=f11e213]:
                - generic [ref=f11e216]: Formula components are validated before they are saved
              - listitem [ref=f11e217]:
                - generic [ref=f11e220]: Employer PF and the gratuity provision sit inside the CTC envelope
              - listitem [ref=f11e221]:
                - generic [ref=f11e224]: Per-department templates, pay groups and CTC bands
