            - paragraph [ref=e331]: "Not as a validation rule somebody could relax — the check row holds a foreign key to the consent, so there is no state in which a check exists without one. And consent is to a SCOPE, not to “background checks”: somebody who agreed to employment verification has not agreed to a credit check, and items outside the recorded scope are refused by name."
