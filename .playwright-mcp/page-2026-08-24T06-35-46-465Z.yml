        - generic [ref=e285]:
          - generic [ref=e286]:
            - paragraph [ref=e287]: Signing
            - heading "The token is the authentication, because a candidate is not a user." [level=3] [ref=e288]
            - paragraph [ref=e289]: Making somebody create an account to accept a job loses offers. So the signing link carries 32 random bytes, stored only as a hash, compared in constant time, hidden on the model, and cleared in the same transaction the signature is written in — a link that still works after use can be accepted twice.
            - list [ref=e290]:
              - listitem [ref=e291]:
                - generic [ref=e294]: Every failure returns the same 404 — wrong, expired, used or withdrawn. Distinguishing them tells an unauthenticated caller which tokens exist
              - listitem [ref=e295]:
                - generic [ref=e298]: The document hash is taken from the UNSIGNED render — it fingerprints the letter as the candidate actually read it
              - listitem [ref=e299]:
                - generic [ref=e302]: Typing a name is a signature. Requiring a drawn one excludes keyboard and assistive-technology users, and an untouched canvas is never stored
              - listitem [ref=e303]:
                - generic [ref=e306]: Declining is offered on the same page — “no reply” is a worse outcome for a recruiter than a reason
          - generic [ref=e308]:
