            - paragraph [ref=e137]: History
            - heading "Where somebody is, and how they got there, are two different facts." [level=3] [ref=e138]
            - paragraph [ref=e139]: One column says which stage a candidacy is in. A separate event log says every transition it made, who made it and when — both written in one transaction through a single service, so a controller cannot quietly become a second pipeline. Moving backwards is allowed and recorded as such, because a forward-only pipeline gets worked around by deleting and recreating the application, which destroys exactly the history you wanted.
            - list [ref=e140]:
              - listitem [ref=e141]:
                - generic [ref=e144]: A candidate is a person; an application is one candidacy
              - listitem [ref=e145]:
                - generic [ref=e148]: Candidate email is unique per organisation, not globally
              - listitem [ref=e149]:
                - generic [ref=e152]: Rejection keeps the stage it happened at — “rejected after the tech round” is a different fact from “rejected on the CV”
              - listitem [ref=e153]:
                - generic [ref=e156]: Funnel reporting per opening, derived from the events
