            - heading "A discrepancy is not a failure." [level=3] [ref=e376]
            - paragraph [ref=e377]: A name spelled differently on a certificate and a fabricated employer are both discrepancies, and only a human should decide what either means. So the vocabulary is clear, discrepancy or insufficient — never pass/fail — and a discrepancy requires both a claimed value and a verified one, because an accusation with no comparison behind it is one nobody can answer.
