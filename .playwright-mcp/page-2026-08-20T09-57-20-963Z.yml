    - generic [ref=f12e287]:
      - generic [ref=f12e288]:
        - heading "A state tax, not a national one" [level=2] [ref=f12e289]
        - paragraph [ref=f12e290]: Professional tax is levied by state governments on the exercise of a profession, trade or employment. There is no national rate and no national slab table, which is why a single “professional tax calculator” that asks only for your salary cannot be right.
        - paragraph [ref=f12e291]:
          - text: "The consequence most often got wrong:"
          - strong [ref=f12e292]: 17 states and union territories levy nothing at all.
          - text: Zero is a correct answer, not a missing one. A payroll system that quietly falls back to a default state when yours is unset is deducting a tax that does not exist and filing a return nobody asked for.
        - heading "The ₹2,500 ceiling explains the odd numbers" [level=2] [ref=f12e293]
        - paragraph [ref=f12e294]: Article 276(2) of the Constitution caps professional tax at ₹2,500 per person per year. Every strange-looking slab is a state working backwards from that limit — including Maharashtra’s ₹200 monthly charge with a ₹300 February, which lands exactly on ₹2,500 over twelve months.
        - paragraph [ref=f12e295]: The February rule applies to the top band only. Applying it across every slab is a common bug, and it overcharges lower earners who were never near the ceiling the rule exists to reach.
        - heading "Why this table is generated, not typed" [level=2] [ref=f12e296]
        - paragraph [ref=f12e297]: The slabs on this page are extracted directly from the CareVance payroll engine by a script, not transcribed by hand. Professional tax tables drift constantly, and a calculator that disagrees with the engine behind it would be worse than no calculator at all — so there is only one copy of these numbers, and this page reads it.
      - generic [ref=f12e298]:
        - paragraph [ref=f12e299]: Where this arithmetic comes from
        - paragraph [ref=f12e300]: PTStateService::STATE_CONFIGS, read directly from the product and regenerated by a sync script rather than retyped. The February special rate and the top-band-only rule come from PTStateService::calculate.
        - paragraph [ref=f12e301]: This calculator runs the same rules as the CareVance payroll engine, ported and spot-checked against it. FY 2025-26 figures. It is not tax advice, and an unusual situation deserves an accountant rather than a web form.
