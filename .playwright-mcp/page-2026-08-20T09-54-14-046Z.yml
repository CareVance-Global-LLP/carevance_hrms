        - heading "Seven stages. One system. No export step anywhere in it." [level=2] [ref=f8e168]
        - paragraph [ref=f8e169]: Every competitor in this market stitches a tracker to an HRMS to a payroll engine across three vendors. Here is what it looks like when one product owns the whole chain — the same employee, the same month, all the way through.
