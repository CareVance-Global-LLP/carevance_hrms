    - generic [ref=f8e120]:
      - generic [ref=f8e121]:
        - paragraph [ref=f8e122]: The actual problem
        - heading "Your tracker doesn’t talk to your HRMS. Your HRMS doesn’t talk to your payroll." [level=2] [ref=f8e123]
        - paragraph [ref=f8e124]: So someone exports a CSV every month and hopes. For most companies this size the real competitor isn’t a rival platform — it’s five disconnected tools and a spreadsheet holding them together.
      - generic [ref=f8e125]:
        - generic [ref=f8e126]:
          - paragraph [ref=f8e127]: Without CareVance
          - list [ref=f8e129]:
            - listitem [ref=f8e130]: A tracker from one vendor. An HRMS from another. Payroll from a third.
            - listitem [ref=f8e133]: Someone exports a CSV on the 25th and hopes the columns still line up.
            - listitem [ref=f8e136]: Attendance disputes are settled from memory, because the evidence is in a different tool.
            - listitem [ref=f8e139]: A salary component is changed, and nobody can say later what it cost or who approved it.
            - listitem [ref=f8e142]: The statutory return disagrees with what was actually deducted, and you find out at filing.
        - generic [ref=f8e145]:
          - paragraph [ref=f8e146]: With CareVance
          - list [ref=f8e148]:
            - listitem [ref=f8e149]: One system owns the tracker, the attendance record and the payroll run.
            - listitem [ref=f8e152]: Attendance syncs into the run through an endpoint you can inspect before you trust it.
            - listitem [ref=f8e155]: The screenshot, the activity classification and the hour it produced are the same record.
            - listitem [ref=f8e158]: Every override carries the engine value beside the applied one, and an append-only audit.
            - listitem [ref=f8e161]: ESI stays locked for the contribution period, so the return and the deduction agree.
