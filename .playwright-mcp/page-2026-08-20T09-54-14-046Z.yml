          - paragraph [ref=f8e674]: The run lifecycle as a real stepper, a pre-run checklist that blocks, and overrides that refuse impossible values while you are still looking at the screen.
        - generic [ref=f8e675]:
          - heading "Manager" [level=3] [ref=f8e676]
          - paragraph [ref=f8e677]: Approvals for leave, time edits and expenses — on the phone, with the ability to forward a request to whoever should actually decide it.
        - generic [ref=f8e678]:
          - heading "Employee" [level=3] [ref=f8e679]
          - paragraph [ref=f8e680]: Payslips, tax declarations with proof upload, an old-versus-new regime simulator, loans, reimbursements and their own onboarding checklist.
    - generic [ref=f8e682]:
      - generic [ref=f8e683]:
        - paragraph [ref=f8e684]: India-deep, not India-available
        - heading "Anyone can say “statutory compliance”. Here are the rules, by name." [level=2] [ref=f8e685]
        - paragraph [ref=f8e686]: Specificity is the only honest trust device available to a company with no logo wall. If you have run Indian payroll, one of these four will tell you whether we have.
      - generic [ref=f8e687]:
        - generic [ref=f8e688]:
          - heading "ESI stays locked for the contribution period" [level=3] [ref=f8e689]
          - paragraph [ref=f8e690]: Coverage is fixed for a whole period — 1 April to 30 September, 1 October to 31 March. Someone covered at the start stays covered to the end, even if a raise takes them past ₹21,000 in month three. Test a payroll tool on this one rule; most drop the employee the instant they cross.
        - generic [ref=f8e691]:
          - heading "PF at the ceiling, with the EPS split" [level=3] [ref=f8e692]
          - paragraph [ref=f8e693]: Twelve percent each side of ₹15,000, and the employer’s half divided EPS 8.33% / EPF 3.67% rather than treated as one number. Above-ceiling handling and VPF are configurable, not assumed.
        - generic [ref=f8e694]:
          - heading "Professional tax is state-levied, and some states levy none" [level=3] [ref=f8e695]
          - paragraph [ref=f8e696]: Thirty-seven states and union territories, month-aware — Maharashtra’s ₹300 February is modelled. A state with no PT returns ₹0, and is never quietly defaulted to a neighbour’s slab.
        - generic [ref=f8e697]:
          - heading "TDS is cumulative, on either regime" [level=3] [ref=f8e698]
          - paragraph [ref=f8e699]: Not a flat twelfth of an annual guess. Old and new regime, FY-keyed slabs, surcharge bands with contiguous boundaries, and 4% cess — with a simulator employees can run themselves.
      - paragraph [ref=f8e701]:
        - strong [ref=f8e702]: And what is not there.
        - text: Thirteen statutory returns generate today. Ten further declaration forms are registered and reported as unavailable, because their templates have not been written — that is real statutory work, and the product says so rather than failing at the moment you click.
        - link "The full list" [ref=f8e703] [cursor=pointer]:
          - /url: /product/compliance
    - generic [ref=f8e706]:
      - generic [ref=f8e707]:
        - paragraph [ref=f8e708]: Security
        - heading "You are about to hand a stranger your salary data." [level=2] [ref=f8e709]
        - paragraph [ref=f8e710]: So here is exactly what is true today, and what is not. There are no badges on this page, because we have not earned any yet.
        - list [ref=f8e711]:
          - listitem [ref=f8e712]:
            - paragraph [ref=f8e713]: Tenant isolation is structural
            - paragraph [ref=f8e714]:
              - generic "97" [ref=f8e715]
              - text: models apply an organisation scope at the ORM layer and stamp the tenant on create. Reading across tenants requires explicitly writing so — which makes it greppable in review.
          - listitem [ref=f8e716]:
            - paragraph [ref=f8e717]: And a test fails the build if it lapses
            - paragraph [ref=f8e718]: A model that owns tenant data but forgets the scope breaks CI. Isolation is enforced by the test suite, not by a reviewer remembering.
          - listitem [ref=f8e719]:
            - paragraph [ref=f8e720]: Two-factor authentication, enforceable
            - paragraph [ref=f8e721]: TOTP with recovery codes, a per-organisation policy of off, grace or enforced, and mandatory enrolment for privileged roles.
          - listitem [ref=f8e722]:
            - paragraph [ref=f8e723]: Monitoring runs on notice and consent
            - paragraph [ref=f8e724]: Screenshots, activity, geofenced punches and selfies all pass one gate. Notices are versioned and never edited; consent is per capture type and can be withdrawn. Under the DPDP Act that liability is the employer’s — so the tools to manage it ship with the tracker.
        - generic [ref=f8e725]:
          - paragraph [ref=f8e726]: Not yet true
          - paragraph [ref=f8e727]: No SOC 2 report and no ISO 27001 certificate. No SSO or SAML — Google OAuth is the only federated sign-in. We would rather you read that here than discover it in procurement.
