        - generic [ref=f8e611]:
          - paragraph [ref=f8e612]:
            - text: Raising Basic by ₹1 does not cost ₹1. It costs
            - generic [ref=f8e613]: ₹1.668
            - text: .
          - paragraph [ref=f8e614]: HRA is derived from Basic. Employer PF and the gratuity provision sit inside the CTC envelope. Four quantities move together, so an admin who types “Basic 60,000” expecting Special Allowance to fall by ₹12,000 watches it fall by ₹20,016. The product shows that before you commit, rather than after.
